[project]
name = "bug-autofix-mvp"
version = "0.1.0"
description = "Minimal Bug Auto-Fix MVP: analyze, approve, ACP fix, verify, cherry-pick to test"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "alembic>=1.13",
  "httpx>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "tenacity>=8.5",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "anthropic>=0.34",
]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]
"app/api/routes.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
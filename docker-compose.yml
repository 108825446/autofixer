services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: autofix
      POSTGRES_USER: autofix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autofix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autofix"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      AUTOFIX_CONFIG: /app/config.yaml
      DATABASE_URL: postgresql+asyncpg://autofix:${POSTGRES_PASSWORD:-autofix}@db:5432/autofix
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./repos:/app/repos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: python -m app.worker_main
    env_file: .env
    environment:
      AUTOFIX_CONFIG: /app/config.yaml
      DATABASE_URL: postgresql+asyncpg://autofix:${POSTGRES_PASSWORD:-autofix}@db:5432/autofix
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
      - ./repos:/app/repos
      - ./work:/app/work
      - ./runner/opencode.json:/root/.config/opencode/opencode.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  poller:
    build: .
    command: python -m app.poller
    env_file: .env
    environment:
      AUTOFIX_CONFIG: /app/config.yaml
      DATABASE_URL: postgresql+asyncpg://autofix:${POSTGRES_PASSWORD:-autofix}@db:5432/autofix
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  backup:
    image: postgres:16
    command: >
      sh -c "while true; do
        pg_dump -h db -U autofix autofix > /backup/autofix-$(date +%F).sql;
        sleep 86400;
      done"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-autofix}
    volumes:
      - ./backup:/backup
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata: